<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Лесное судоку — Краинская Ирина Александровна</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #fff8eb 0%, #eef8e8 50%, #e6f4ff 100%);
    color: #2c3e2e;
  }

  .app {
    width: 100%;
    height: 100dvh;
    max-width: 680px;
    margin: 0 auto;
    padding: 8px 10px 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 8px;
  }

  /* Header */
  .header {
    background: #ffffff;
    border: 2px solid #f0c987;
    border-radius: 16px;
    padding: 7px 12px;
    box-shadow: 0 3px 10px rgba(139, 98, 42, 0.08);
    flex-shrink: 0;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .title-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .title-icon {
    font-size: 20px;
    line-height: 1;
  }

  h1 {
    margin: 0;
    font-size: clamp(16px, 4.2vw, 21px);
    font-weight: 800;
    color: #b85d19;
    line-height: 1.15;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .badge {
    background: #fff6dc;
    border: 1.5px solid #e7b85d;
    color: #8a5310;
    font-weight: 800;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .btn {
    border: none;
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.12);
    transition: transform 0.1s ease, filter 0.15s ease;
    white-space: nowrap;
  }

  .btn:active {
    transform: scale(0.95);
  }

  .btn-sound {
    background: #279b61;
  }

  .btn-sound.muted {
    background: #8b959e;
  }

  .btn-reset {
    background: #3b82f6;
  }

  .btn-new {
    background: #e67e22;
  }

  .author {
    margin-top: 4px;
    font-size: clamp(11px, 2.9vw, 13px);
    color: #4f6352;
    font-weight: 600;
    line-height: 1.25;
  }

  .hint-bar {
    text-align: center;
    font-size: clamp(11.5px, 3vw, 13.5px);
    font-weight: 700;
    color: #3d5a40;
    background: rgba(255, 255, 255, 0.78);
    border-radius: 10px;
    padding: 4px 8px;
    flex-shrink: 0;
  }

  /* Board container */
  .board-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    border: 2.5px solid #8ecae6;
    border-radius: 18px;
    padding: 8px;
    box-shadow: 0 4px 14px rgba(33, 118, 174, 0.08);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 6px;
    width: min(100%, 420px, 50dvh);
    height: min(100%, 420px, 50dvh);
    aspect-ratio: 1 / 1;
  }

  .cell {
    position: relative;
    background: #ffffff;
    border: 2px solid #94a3b8;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    transition: background-color 0.2s, border-color 0.2s, transform 0.15s;
    overflow: hidden;
  }

  .cell.fixed {
    background: #fdfbf7;
    border-color: #cbd5e1;
  }

  .cell.empty {
    background: #f4faff;
    border: 2.5px dashed #60a5fa;
    cursor: pointer;
  }

  .cell.empty::after {
    content: "?";
    font-size: clamp(20px, 5vw, 28px);
    font-weight: 800;
    color: #93c5fd;
  }

  .cell.empty.drag-over {
    background: #dbeafe;
    border-color: #2563eb;
    transform: scale(1.03);
  }

  .cell.solved {
    background: #ecfdf5;
    border: 2.5px solid #10b981;
    animation: popIn 0.35s ease;
  }

  .cell.error {
    background: #fef2f2 !important;
    border: 2.5px solid #ef4444 !important;
    animation: shake 0.4s ease;
  }

  .cell.highlight-conflict {
    background: #fee2e2 !important;
    border-color: #f87171 !important;
  }

  .cell img {
    width: 88%;
    height: 88%;
    object-fit: contain;
    pointer-events: none;
  }

  /* Tray at the bottom */
  .tray-wrap {
    background: #ffffff;
    border: 2.5px solid #86efac;
    border-radius: 18px;
    padding: 8px 10px;
    box-shadow: 0 4px 12px rgba(22, 163, 74, 0.08);
    flex-shrink: 0;
  }

  .tray {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    max-width: 440px;
    margin: 0 auto;
  }

  .card {
    position: relative;
    aspect-ratio: 1 / 1;
    max-height: 15dvh;
    margin: 0 auto;
    width: 100%;
    background: #fffdf7;
    border: 2.5px solid #f59e0b;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5px;
    cursor: grab;
    touch-action: none;
    box-shadow: 0 3px 6px rgba(217, 119, 6, 0.14);
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .card:active {
    cursor: grabbing;
  }

  .card.selected {
    border-color: #2563eb;
    background: #eff6ff;
    transform: translateY(-4px) scale(1.04);
    box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25);
  }

  .card.done-all {
    opacity: 0.55;
    border-color: #10b981;
    background: #ecfdf5;
  }

  .card.done-all::after {
    content: "✓";
    position: absolute;
    top: 3px;
    right: 5px;
    font-size: 14px;
    font-weight: 900;
    color: #059669;
  }

  .card img {
    width: 88%;
    height: 88%;
    object-fit: contain;
    pointer-events: none;
  }

  /* Floating dragged clone */
  .drag-ghost {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    width: 78px;
    height: 78px;
    background: rgba(255, 255, 255, 0.96);
    border: 3px solid #2563eb;
    border-radius: 16px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5px;
    transform: translate(-50%, -50%);
  }

  .drag-ghost img {
    width: 88%;
    height: 88%;
    object-fit: contain;
  }

  /* Victory modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    padding: 16px;
  }

  .modal-backdrop.show {
    display: flex;
    animation: fadeIn 0.25s ease;
  }

  .modal {
    background: #ffffff;
    border: 3px solid #f59e0b;
    border-radius: 22px;
    padding: 22px 20px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    box-shadow: 0 16px 36px rgba(0,0,0,0.25);
  }

  .modal-emoji {
    font-size: 46px;
    margin-bottom: 6px;
  }

  .modal h2 {
    margin: 0 0 8px;
    font-size: 22px;
    color: #b85d19;
  }

  .modal p {
    margin: 0 0 16px;
    font-size: 15px;
    color: #475569;
    line-height: 1.4;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .modal-actions .btn {
    font-size: 14px;
    padding: 9px 16px;
  }

  @keyframes popIn {
    0% { transform: scale(0.75); }
    70% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (min-width: 720px) and (orientation: landscape) {
    .app {
      max-width: 860px;
      padding: 10px 16px;
    }
    .main-area {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .board-wrap {
      height: 100%;
      flex: 1 1 auto;
    }
    .grid {
      width: min(100%, 66dvh);
      height: min(100%, 66dvh);
    }
    .tray-wrap {
      width: 140px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tray {
      grid-template-columns: 1fr;
      grid-template-rows: repeat(4, 1fr);
      width: 100%;
      height: min(100%, 66dvh);
    }
    .card {
      max-height: none;
      width: auto;
      height: 100%;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-top">
      <div class="title-wrap">
        <span class="title-icon">🌲</span>
        <h1>Лесное судоку</h1>
      </div>
      <div class="controls">
        <span class="badge" id="progressBadge">0 / 4</span>
        <button class="btn btn-sound" id="soundBtn" type="button">🔊 Звук</button>
        <button class="btn btn-reset" id="resetBtn" type="button">↻ Заново</button>
        <button class="btn btn-new" id="newBtn" type="button">🎲 Ещё</button>
      </div>
    </div>
    <div class="author">Автор: Краинская Ирина Александровна, педагог дополнительного образования</div>
  </header>

  <div class="hint-bar">Расставь зверят так, чтобы они не повторялись ни в строчке, ни в столбике!</div>

  <div class="main-area" style="display:contents;">
    <div class="board-wrap">
      <div class="grid" id="grid"></div>
    </div>

    <div class="tray-wrap">
      <div class="tray" id="tray"></div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="winModal">
  <div class="modal">
    <div class="modal-emoji">🎉🦉🦊🐿️🦔</div>
    <h2>Молодец!</h2>
    <p>Все лесные зверята заняли свои клеточки без единого повтора!</p>
    <div class="modal-actions">
      <button class="btn btn-reset" id="modalReplayBtn" type="button">↻ Ещё раз</button>
      <button class="btn btn-new" id="modalNextBtn" type="button">🎲 Новая задача</button>
    </div>
  </div>
</div>

  const mainArea = document.querySelector(".main-area");
  function updateLayoutDisplay() {

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }

  function playCorrectSound() {
    if (!soundEnabled) return;
    ensureAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const notes = [523.25, 659.25, 783.99];
    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, now + idx * 0.07);
      gain.gain.setValueAtTime(0.001, now + idx * 0.07);
      gain.gain.exponentialRampToValueAtTime(0.18, now + idx * 0.07 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + idx * 0.07);
      osc.stop(now + idx * 0.07 + 0.26);
    });
  }

  function playErrorSound() {
    if (!soundEnabled) return;
    ensureAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const freqs = [220, 165];
    freqs.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(freq, now + idx * 0.14);
      gain.gain.setValueAtTime(0.001, now + idx * 0.14);
      gain.gain.exponentialRampToValueAtTime(0.16, now + idx * 0.14 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.18);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + idx * 0.14);
      osc.stop(now + idx * 0.14 + 0.19);
    });
  }

  function playWinSound() {
    if (!soundEnabled) return;
    ensureAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const melody = [
      { f: 523.25, t: 0.00, d: 0.14 },
      { f: 659.25, t: 0.14, d: 0.14 },
      { f: 783.99, t: 0.28, d: 0.14 },
      { f: 1046.50, t: 0.44, d: 0.42 }
    ];
    melody.forEach(n => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(n.f, now + n.t);
      gain.gain.setValueAtTime(0.001, now + n.t);
      gain.gain.exponentialRampToValueAtTime(0.22, now + n.t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + n.t);
      osc.stop(now + n.t + n.d + 0.02);
    });
  }

  function loadInitialPuzzle() {
    isCustomVariant = false;
    solution = INITIAL_SOLUTION.map(r => [...r]);
    fixedMask = INITIAL_MASK.map(r => [...r]);
    state = solution.map((row, r) => row.map((val, c) => fixedMask[r][c] ? val : null));
    selectedAnimal = null;
    winModal.classList.remove("show");
    renderAll();
  }

  function generateRandomPuzzle() {
    isCustomVariant = true;
    // Shuffle symbols, rows within bands, and cols within stacks to preserve valid 4x4 Sudoku
    const syms = [...CARD_ORDER].sort(() => Math.random() - 0.5);
    const map = {
      squirrel: syms[0],
      owl: syms[1],
      fox: syms[2],
      hedgehog: syms[3]
    };
    let grid = INITIAL_SOLUTION.map(row => row.map(cell => map[cell]));

    // Swap rows inside 2-row bands
    if (Math.random() < 0.5) [grid[0], grid[1]] = [grid[1], grid[0]];
    if (Math.random() < 0.5) [grid[2], grid[3]] = [grid[3], grid[2]];
    // Swap bands
    if (Math.random() < 0.5) {
      [grid[0], grid[2]] = [grid[2], grid[0]];
      [grid[1], grid[3]] = [grid[3], grid[1]];
    }
    // Swap cols inside 2-col stacks
    if (Math.random() < 0.5) {
      grid.forEach(r => { [r[0], r[1]] = [r[1], r[0]]; });
    }
    if (Math.random() < 0.5) {
      grid.forEach(r => { [r[2], r[3]] = [r[3], r[2]]; });
    }

    // Pick 1 empty cell per row and 1 per column (permutation of 0..3) so each of the 4 cards is used once!
    const perm = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
    solution = grid;
    fixedMask = [0, 1, 2, 3].map(r => [0, 1, 2, 3].map(c => perm[r] !== c));
    state = solution.map((row, r) => row.map((val, c) => fixedMask[r][c] ? val : null));
    selectedAnimal = null;
    winModal.classList.remove("show");
    renderAll();
  }

  function resetCurrentPuzzle() {
    state = solution.map((row, r) => row.map((val, c) => fixedMask[r][c] ? val : null));
    selectedAnimal = null;
    winModal.classList.remove("show");
    renderAll();
  }

  function getProgress() {
    let totalEmpty = 0;
    let solvedCount = 0;
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        if (!fixedMask[r][c]) {
          totalEmpty++;
          if (state[r][c] !== null) solvedCount++;
        }
      }
    }
    return { solvedCount, totalEmpty };
  }

  function renderAll() {
    const { solvedCount, totalEmpty } = getProgress();
    progressBadge.textContent = `${solvedCount} / ${totalEmpty}`;

    // Render Grid
    gridEl.innerHTML = "";
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.row = r;
        cell.dataset.col = c;

        const val = state[r][c];
        if (fixedMask[r][c]) {
          cell.classList.add("fixed");
          const img = document.createElement("img");
          img.src = SPRITES[val];
          img.alt = NAMES[val];
          cell.appendChild(img);
        } else if (val !== null) {
          cell.classList.add("solved");
          const img = document.createElement("img");
          img.src = SPRITES[val];
          img.alt = NAMES[val];
          cell.appendChild(img);
        } else {
          cell.classList.add("empty");
          cell.addEventListener("click", () => {
            if (selectedAnimal) {
              attemptPlace(r, c, selectedAnimal);
            }
          });
        }
        gridEl.appendChild(cell);
      }
    }

    // Render Bottom Tray
    trayEl.innerHTML = "";
    CARD_ORDER.forEach(animal => {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.animal = animal;
      if (selectedAnimal === animal) card.classList.add("selected");

      // Check if all required instances of this animal are already placed
      let remainingNeeded = 0;
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (!fixedMask[r][c] && solution[r][c] === animal && state[r][c] === null) {
            remainingNeeded++;
          }
        }
      }
      if (remainingNeeded === 0) {
        card.classList.add("done-all");
      }

      const img = document.createElement("img");
      img.src = SPRITES[animal];
      img.alt = NAMES[animal];
      card.appendChild(img);

      setupCardInteraction(card, animal);
      trayEl.appendChild(card);
    });
  }

  function highlightConflicts(row, col, animal) {
    const cells = gridEl.querySelectorAll(".cell");
    cells.forEach(el => {
      const r = Number(el.dataset.row);
      const c = Number(el.dataset.col);
      if ((r === row || c === col) && state[r][c] === animal) {
        el.classList.add("highlight-conflict");
        setTimeout(() => el.classList.remove("highlight-conflict"), 650);
      }
    });
  }

  function attemptPlace(row, col, animal) {
    if (fixedMask[row][col] || state[row][col] !== null) return;

    const targetCell = gridEl.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);

    if (solution[row][col] === animal) {
      state[row][col] = animal;
      selectedAnimal = null;
      playCorrectSound();
      renderAll();

      const { solvedCount, totalEmpty } = getProgress();
      if (solvedCount === totalEmpty) {
        setTimeout(() => {
          playWinSound();
          winModal.classList.add("show");
        }, 320);
      }
    } else {
      playErrorSound();
      if (targetCell) {
        targetCell.classList.remove("error");
        void targetCell.offsetWidth;
        targetCell.classList.add("error");
        setTimeout(() => targetCell.classList.remove("error"), 550);
      }
      highlightConflicts(row, col, animal);
    }
  }

  function setupCardInteraction(card, animal) {
    let dragging = false;
    let moved = false;
    let ghost = null;
    let startX = 0;
    let startY = 0;
    let lastHoverCell = null;

    function clearHover() {
      if (lastHoverCell) {
        lastHoverCell.classList.remove("drag-over");
        lastHoverCell = null;
      }
    }

    function getDropCoordinates(clientX, clientY, isTouch) {
      // Slight upward offset on touch so the child's finger does not hide the cell
      const offsetY = isTouch ? -38 : 0;
      return { x: clientX, y: clientY + offsetY };
    }

    function findEmptyCellAt(x, y) {
      const el = document.elementFromPoint(x, y);
      if (!el) return null;
      const cell = el.closest(".cell.empty");
      return cell;
    }

    card.addEventListener("pointerdown", (e) => {
      ensureAudio();
      e.preventDefault();
      card.setPointerCapture(e.pointerId);
      dragging = true;
      moved = false;
      startX = e.clientX;
      startY = e.clientY;
    });

    card.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (!moved && Math.hypot(dx, dy) > 8) {
        moved = true;
        selectedAnimal = animal;
        ghost = document.createElement("div");
        ghost.className = "drag-ghost";
        const gImg = document.createElement("img");
        gImg.src = SPRITES[animal];
        ghost.appendChild(gImg);
        document.body.appendChild(ghost);
      }
      if (moved && ghost) {
        const isTouch = e.pointerType === "touch";
        const pos = getDropCoordinates(e.clientX, e.clientY, isTouch);
        ghost.style.left = pos.x + "px";
        ghost.style.top = pos.y + "px";

        const hoverCell = findEmptyCellAt(pos.x, pos.y);
        if (hoverCell !== lastHoverCell) {
          clearHover();
          if (hoverCell) {
            hoverCell.classList.add("drag-over");
            lastHoverCell = hoverCell;
          }
        }
      }
    });

    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      clearHover();
      if (ghost) {
        ghost.remove();
        ghost = null;
      }
      if (moved) {
        const isTouch = e.pointerType === "touch";
        const pos = getDropCoordinates(e.clientX, e.clientY, isTouch);
        const targetCell = findEmptyCellAt(pos.x, pos.y);
        if (targetCell) {
          const r = Number(targetCell.dataset.row);
          const c = Number(targetCell.dataset.col);
          attemptPlace(r, c, animal);
        } else {
          renderAll();
        }
      } else {
        // Tap to select/deselect
        selectedAnimal = (selectedAnimal === animal) ? null : animal;
        renderAll();
      }
    }

    card.addEventListener("pointerup", endDrag);
    card.addEventListener("pointercancel", endDrag);
  }

  soundBtn.addEventListener("click", () => {
    soundEnabled = !soundEnabled;
    if (soundEnabled) {
      ensureAudio();
      soundBtn.textContent = "🔊 Звук";
      soundBtn.classList.remove("muted");
      playCorrectSound();
    } else {
      soundBtn.textContent = "🔇 Без звука";
      soundBtn.classList.add("muted");
    }
  });

  resetBtn.addEventListener("click", () => {
    ensureAudio();
    resetCurrentPuzzle();
  });

  newBtn.addEventListener("click", () => {
    ensureAudio();
    generateRandomPuzzle();
  });

  modalReplayBtn.addEventListener("click", () => {
    ensureAudio();
    resetCurrentPuzzle();
  });

  modalNextBtn.addEventListener("click", () => {
    ensureAudio();
    generateRandomPuzzle();
  });

  loadInitialPuzzle();
})();
</script>
</body>
</html>
